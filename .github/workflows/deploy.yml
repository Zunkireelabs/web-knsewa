name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PROD_WEB3FORMS_ACCESS_KEY }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            DIR="/home/zunkireelabs/devprojects/websiteprojects/knsewa-web-dev"
            cd "$DIR"

            # Ensure origin points at the org repo (this directory previously
            # tracked a personal fork).
            git remote set-url origin https://github.com/Zunkireelabs/web-knsewa.git
            git fetch origin
            git checkout main
            git reset --hard origin/main

            # Write build-time secrets to .env (overwritten each deploy)
            cat > .env << 'ENVEOF'
            NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY=${{ secrets.PROD_WEB3FORMS_ACCESS_KEY }}
            ENVEOF

            docker compose -f docker-compose.yml up -d --build

            echo "Waiting for container to be healthy..."
            sleep 10
            CONTAINER="knsewa-web-prod"
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs "$CONTAINER" --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.PROD_DOMAIN }}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Production health check passed (HTTP $HTTP_CODE)"
          else
            echo "Production health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
