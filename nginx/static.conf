server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/;
    index index.html;

    # Cache Static Assets (1 Year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # RSC payload files — serve for Next.js client navigation but block from indexing
    location ~* \.txt$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Redirect directory paths without trailing slash to canonical trailing-slash URL
    # Matches /about, /services/commercial, etc. — skips paths with file extensions
    location ~ ^(/[^.]+[^/])$ {
        return 301 $uri/;
    }

    # Serve static export pages
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
